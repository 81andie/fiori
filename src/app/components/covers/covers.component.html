
<app-card-reproductor
[audios]="audioCovers"
[playlistId]="audioCovers"
gradient="bg-gradient-to-b from-cyan-800 to-cyan-200"
></app-card-reproductor>

<div data-aos="fade-up" data-aos-easing="linear"
    data-aos-duration="500" >
<hr class="h-6 mt-16 bg-cover bg-center bg-[url(/Pexels-aparaxic.jpg)] grayscale">
<h1
  class="text-xl m-1 bg-clip-text text-transparent bg-gradient-to-b from-stone-400 to-stone-900 hover:to-slate-400
  600"
  data-aos="zoom-in-right" data-aos="fade-up" data-aos-easing="linear" data-aos-duration="400">


</h1>
<hr class="h-1 w-full bg-cover bg-bottom bg-[url(/textil.jpg)] grayscale ">
</div>


 <div class="space-y-0">
    @for (item of audioCovers; track item.id; let idx = $index) {
    <section data-aos="fade-up" data-aos-easing="linear" data-aos-duration="500"
      class="relative h-screen flex flex-col items-center justify-center text-center text-white  lg:bg-right-top sm:bg-left-bottom bg-cover bg-fixed"
      [ngStyle]="{'background-image': 'url(' + item.image + ')'}">
      <!-- Capa oscura -->
      <div class="absolute inset-0 bg-black bg-opacity-40"></div>

      <!-- Contenido -->
      <div class="relative z-10 space-y-0">
        <p class="text-xl font-bold">{{item.title}}</p>


        <div class="text-xs md:text-xl lg:text-xl text-white/80">
          <pre>{{item.songTitle }}</pre>
          <pre>{{ item.verses }}</pre>
        </div>

        <div class="text-xs md:text-xl lg:text-xl text-white/80">
          <pre>{{ item.fontSong}}</pre>
          <pre>{{ item.licenciaPain}}</pre>
        </div>
      </div>
    </section>
    }
  </div>
